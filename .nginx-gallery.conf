# Nginx configuration for Gallery

# Gallery directory protection
location /gallery/ {
    try_files $uri $uri/ /index.php?$query_string;
}

# Upload limits.
#
# This is no longer what caps the size of a gallery file. Uploads are sliced
# into 5MB chunks by the browser (GalleryConfig::CHUNK_SIZE) and no single
# request carries more than MAX_CHUNK_SIZE, so the real ceiling is
# MAX_VIDEO_SIZE in includes/gallery/config.php — currently 500MB.
#
# Left generous rather than trimmed to chunk size: this file may be included
# above other locations, and tightening it here would quietly cap those too.
# PHP's upload_max_filesize and post_max_size still need to clear one chunk
# (8MB) or every upload fails on its first slice.
client_max_body_size 50M;
client_body_timeout 120s;

# upload_finalize streams up to MAX_VIDEO_SIZE through stream_copy_to_stream
# and then runs finfo over the result; serve.php streams the same file back
# out. Either can outlast nginx's 60s fastcgi default on cold storage, and the
# failure surfaces as a generic upload error with the chunks already written.
#
# Set at server level rather than in the api.php location: the try_files
# rewrite lands in the `~ \.php$` location, and that is the block that holds
# fastcgi_pass, so a timeout set anywhere else never applies.
fastcgi_read_timeout 180s;
fastcgi_send_timeout 180s;

# Long enough for a slow phone on camp wifi to pull a 500MB video. The global
# `send_timeout 10` is measured between successive writes, and serve.php now
# flushes every 256KB, but 10s leaves no headroom at all.
send_timeout 120s;

# Override caching for gallery-served files (they require authentication)
location ~ ^/gallery/serve\.php {
    # No caching for authenticated content
    add_header Cache-Control "private, no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
    
    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";

    try_files $uri $uri/ /serve.php?$query_string;
}

location ~ ^/gallery/(.*\.css|.*\.js)$ {
    add_header Cache-Control "max-age=31536000";
}

# Rate limiting for uploads
#limit_req_zone $binary_remote_addr zone=gallery_upload:10m rate=5r/m;

# There is deliberately no location block for /gallery/api.php.
#
# The old `location /gallery/api\.php` was a *prefix* location containing a
# regex escape, so nginx matched the backslash literally and the block was
# dead. Correcting it to an exact match (`location = /gallery/api.php`) is
# worse than leaving it dead: `=` outranks every regex location, so it wins
# over `~ \.php$` — and its `try_files $uri` then finds the real file on disk
# and serves it *in this location*, as a static asset. No internal redirect
# happens, fastcgi_pass is never reached, and nginx hands the client the raw
# PHP source of api.php. (try_files only redirects into another location when
# the earlier arguments do NOT resolve to a file.)
#
# api.php exists on disk and needs no rewrite — it just needs to be executed,
# which `~ \.php$` in the server block already does. So: no block at all.
#
# Same trap applies to the serve.php block above. It survives only because it
# is a regex, and `~ \.php$` is defined earlier in the server block and wins;
# that also means its no-cache and security headers never actually apply. Do
# not "fix" it into `location = /gallery/serve.php` — that would leak the
# source of serve.php and, with it, the authenticated media it gates.
