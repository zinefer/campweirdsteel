---
# campweirdsteel deployment
#
# Corrected copy of the playbook that lived in the ansible repo. What changed,
# and why, is commented inline at each site. The short version:
#
#   1. `disable_functions` no longer blocks the gallery transcode worker.
#   2. PHP/nginx timeouts and sizes match the 500MB video ceiling.
#   3. The gallery storage directory is created and owned, not assumed.
#   4. fail2ban no longer bans camp members for uploading.
#
# Requires: the `campweirdsteel` host, plus handlers/global.yml and common.yml
# from the ansible repo alongside this file.

- hosts: campweirdsteel
  gather_facts: no

  vars:
    app_root: /var/www/campweirdsteel
    config_mount: /mnt/config/campweirdsteel
    storage_mount: /mnt/storage/campweirdsteel

    # The gallery slices uploads into GalleryConfig::CHUNK_SIZE (5MB) pieces
    # and caps a single request at MAX_CHUNK_SIZE (8MB), so PHP only ever has
    # to accept 8MB at a time. 64M leaves generous headroom and keeps Flarum's
    # own attachment handling comfortable.
    php_upload_max_filesize: 64M
    php_post_max_size: 64M
    # upload_finalize assembles up to MAX_VIDEO_SIZE (500MB) from chunks and
    # runs finfo over the result. The 30s default is not enough on cold
    # storage.
    php_max_execution_time: 120
    php_max_input_time: 120

  handlers:
    - import_tasks: handlers/global.yml
    - name: reload systemctl
      command: systemctl daemon-reload
    - name: restart campweirdsteel
      service:
        name: campweirdsteel
        state: restarted
    - name: restart nginx
      service:
        name: nginx
        state: restarted
    - name: restart mariadb
      service:
        name: mariadb
        state: restarted
    - name: restart php-fpm
      service:
        name: "php{{ php_version.stdout }}-fpm"
        state: restarted
    - name: enable ufw
      ufw:
        state: enabled
    - name: restart fail2ban
      service:
        name: fail2ban
        state: restarted
    - name: restart unattended-upgrades
      service:
        name: unattended-upgrades
        state: restarted
    - name: restart sshd
      service:
        name: sshd
        state: restarted

  pre_tasks:
    - name: Include Common
      include_tasks: common.yml

  tasks:
    # ffmpeg/ffprobe land at /usr/bin/ffmpeg and /usr/bin/ffprobe on Ubuntu,
    # which is what GalleryConfig::FFMPEG_BINARY / FFPROBE_BINARY expect. The
    # `php` metapackage pulls php-cli, providing /usr/bin/php for
    # PHP_CLI_BINARY.
    #
    # `state: present` rather than `latest` for the infrastructure packages:
    # `latest` meant every deploy could pull a MariaDB or nginx update and
    # restart the database as a side effect of shipping a CSS change.
    - name: Install required system packages
      apt:
        name:
          - php
          - php-fpm
          - php-curl
          - php-xml
          - php-gd
          - php-mysql
          - php-mbstring
          - php-zip
          - php-json
          - php-fileinfo
          - php-tokenizer
          - composer
          - unzip
          - curl
          - nginx
          - mariadb-server
          - mariadb-client
          - python3-pymysql
          - ufw
          - fail2ban
          - logwatch
          - unattended-upgrades
          - apt-listchanges
          - ffmpeg
          - git
        state: present
        update_cache: yes

    - name: Verify gallery media binaries are where config.php expects them
      stat:
        path: "{{ item }}"
      register: media_binaries
      loop:
        - /usr/bin/ffmpeg
        - /usr/bin/ffprobe
        - /usr/bin/php

    - name: Fail early if a gallery media binary is missing
      assert:
        that: item.stat.exists and item.stat.executable
        fail_msg: >-
          {{ item.item }} is missing or not executable. GalleryConfig points at
          this path; video transcoding and poster frames will silently no-op
          without it.
      loop: "{{ media_binaries.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Create www-data user
      user:
        name: www-data
        system: yes
        createhome: no
        shell: /usr/sbin/nologin

    # Web-focused Security (for partially exposed container)
    - name: Basic SSH security (minimal hardening for internal access)
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        backup: yes
      loop:
        - { regexp: '^#?X11Forwarding', line: 'X11Forwarding no' }
        - { regexp: '^#?PermitEmptyPasswords', line: 'PermitEmptyPasswords no' }
      notify: restart sshd

    - name: Configure web-focused kernel security parameters
      sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        reload: yes
      loop:
        - { name: 'net.ipv4.tcp_syncookies', value: '1' }
        - { name: 'net.ipv4.icmp_echo_ignore_broadcasts', value: '1' }
        - { name: 'net.ipv4.icmp_ignore_bogus_error_responses', value: '1' }
        - { name: 'net.ipv4.conf.all.log_martians', value: '1' }

    - name: Remove web-server conflicting packages only
      apt:
        name:
          - apache2
          - vsftpd
        state: absent
        purge: yes
      ignore_errors: yes

    - name: Disable conflicting web services
      systemd:
        name: "{{ item }}"
        enabled: no
        state: stopped
      loop:
        - apache2
        - vsftpd
      ignore_errors: yes

    - name: Initialize UFW before adding rules
      ufw:
        state: enabled
      ignore_errors: yes

    - name: Configure UFW firewall (web-focused)
      ufw:
        rule: "{{ item.rule }}"
        port: "{{ item.port }}"
        proto: "{{ item.proto | default('tcp') }}"
        from_ip: "{{ item.from | default('any') }}"
      loop:
        - { rule: "allow", port: "22", from: "192.168.0.0/16" }
        - { rule: "allow", port: "80", from: "192.168.69.0/24" }

    - name: Enable UFW with default deny
      ufw:
        state: enabled
        policy: deny

    # fail2ban.
    #
    # Two things were wrong here and they hid each other. `nginx-req-limit`
    # pointed at error.log while its custom filter's regex is written against
    # access.log, so it matched nothing. `nginx-bad-request` names a filter
    # fail2ban does not ship, so that jail failed to start outright.
    #
    # Fixing them naively is worse than leaving them broken: a 500MB upload is
    # ~100 chunk POSTs, api.php answers *every* error with HTTP 400, and the
    # client retries each chunk three times. A "ban on 4xx" jail with
    # maxretry 3 would ban a camp member seconds into one bad upload.
    #
    # So: drop the phantom jail, point the custom filter at the log it was
    # written for, raise maxretry well above one upload's worth of retries,
    # and exempt the camp LAN and the gallery API outright.
    - name: Create custom fail2ban filters
      copy:
        content: |
          [Definition]
          # Deliberately excludes /gallery/ — see the jail comment. Bare 404s
          # for static assets are noise, not an attack signal, so only 5xx and
          # the auth/abuse-flavoured 4xx count.
          failregex = ^<HOST> -.*"(GET|POST|HEAD).*HTTP.*" (401|403|444|5\d\d)
          ignoreregex = ^<HOST> -.*"(GET|POST).*/gallery/.*HTTP.*"
        dest: /etc/fail2ban/filter.d/nginx-req-limit.conf
      notify: restart fail2ban

    - name: Configure fail2ban for web security
      copy:
        content: |
          [DEFAULT]
          # Camp LAN never gets banned. Everyone uploading is on it, and a
          # chunked upload is request-dense enough to look like abuse.
          ignoreip = 127.0.0.1/8 ::1 192.168.0.0/16

          [nginx-http-auth]
          enabled = true
          filter = nginx-http-auth
          logpath = /var/log/nginx/error.log
          maxretry = 5
          bantime = 3600

          [nginx-req-limit]
          enabled = true
          filter = nginx-req-limit
          # access.log, which is the format the filter above matches. This
          # said error.log, so the jail was inert.
          logpath = /var/log/nginx/access.log
          # One failed 500MB upload is ~300 requests after retries. 10 was low
          # enough to ban an uploader having a bad wifi day.
          maxretry = 60
          findtime = 600
          bantime = 3600

          [nginx-botsearch]
          enabled = true
          filter = nginx-botsearch
          logpath = /var/log/nginx/error.log
          maxretry = 5
          bantime = 7200

          # [nginx-bad-request] removed: fail2ban ships no filter by that
          # name, so the jail failed to start and took the rest of the config
          # with it on some versions.
        dest: /etc/fail2ban/jail.d/nginx.local
      notify: restart fail2ban

    - name: Enable fail2ban service
      service:
        name: fail2ban
        state: started
        enabled: yes

    - name: Configure automatic security updates
      copy:
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Download-Upgradeable-Packages "1";
          APT::Periodic::AutocleanInterval "7";
          APT::Periodic::Unattended-Upgrade "1";
        dest: /etc/apt/apt.conf.d/20auto-upgrades

    - name: Configure unattended-upgrades
      template:
        src: templates/campweirdsteel/unattended-upgrades.j2
        dest: /etc/apt/apt.conf.d/50unattended-upgrades
      notify: restart unattended-upgrades

    # For fast development, we deploy using git directly:
    - name: Remove old application files
      file:
        path: "{{ app_root }}"
        state: absent

    - name: Clone campweirdsteel repository directly
      git:
        repo: 'https://github.com/zinefer/campweirdsteel.git'
        dest: "{{ app_root }}"
        version: master
        force: yes
      become: yes

    - name: Set ownership for application directory
      file:
        path: "{{ app_root }}"
        owner: www-data
        group: www-data
        mode: '0755'
        recurse: yes
        # The storage/assets/gallery-storage symlinks are created further
        # down, but a re-run can hit them here. Never chown through a symlink
        # into the mounts.
        follow: no

    - name: Ensure mounted config directory has correct permissions
      file:
        path: "{{ config_mount }}"
        state: directory

    - name: Ensure mounted storage directory has correct permissions
      file:
        path: "{{ storage_mount }}"
        state: directory

    - name: Create Flarum storage directory on cold storage
      file:
        path: "{{ storage_mount }}/storage"
        state: directory

    - name: Create Flarum assets directory on hot storage
      file:
        path: "{{ config_mount }}/assets"
        state: directory

    - name: Create MariaDB data directory on cold storage
      file:
        path: "{{ storage_mount }}/mysql"
        state: directory

    # This was missing entirely, yet `Create gallery symlink` below points
    # gallery-storage at it. On a fresh box realpath() returns false and the
    # whole gallery throws "Gallery storage path not found".
    #
    # Ownership matters as much as existence now: PHP-FPM creates `.uploads/`
    # (chunk staging), `.locks/` (transcode concurrency slots) and per-year
    # `.processing/` directories underneath this at runtime.
    - name: Create gallery storage directory on cold storage
      file:
        path: "{{ storage_mount }}/gallery"
        state: directory
        owner: www-data
        group: www-data
        mode: '0775'

    - name: Create gallery runtime subdirectories
      file:
        path: "{{ storage_mount }}/gallery/{{ item }}"
        state: directory
        owner: www-data
        group: www-data
        mode: '0775'
      loop:
        - .uploads
        - .locks

    - name: Install composer dependencies
      become: yes
      become_user: www-data
      command: composer install --no-interaction --prefer-dist --optimize-autoloader
      args:
        chdir: "{{ app_root }}"

    # symfony/process arrives as a php-ffmpeg dependency and is what
    # GalleryManager::queueTranscode() uses to spawn the transcode worker
    # (proc_open, which survives the disable_functions list below). If it is
    # absent, every uploaded video is filed unconverted and nothing says so.
    - name: Verify symfony/process is installed for the transcode worker
      stat:
        path: "{{ app_root }}/vendor/symfony/process/Process.php"
      register: symfony_process

    - name: Fail if symfony/process is missing
      assert:
        that: symfony_process.stat.exists
        fail_msg: >-
          vendor/symfony/process is missing. GalleryManager::queueTranscode()
          needs it to spawn the video transcode worker; without it uploaded
          videos are never converted and .mov/HEVC files will not play.

    # Improved symlink handling for storage directory
    - name: Check if storage is already a symlink
      stat:
        path: "{{ app_root }}/storage"
      register: storage_stat

    - name: Check if mounted storage is empty
      find:
        paths: "{{ storage_mount }}/storage"
        file_type: any
      register: mounted_storage_contents
      when: storage_stat.stat.exists and not storage_stat.stat.islnk

    - name: Backup original storage to mount
      copy:
        src: "{{ app_root }}/storage/"
        dest: "{{ storage_mount }}/storage/"
        remote_src: yes
        owner: www-data
        group: www-data
        mode: preserve
      when:
        - storage_stat.stat.exists
        - not storage_stat.stat.islnk
        - mounted_storage_contents.matched == 0

    - name: Remove original storage directory
      file:
        path: "{{ app_root }}/storage"
        state: absent
      when: storage_stat.stat.exists and not storage_stat.stat.islnk

    - name: Create storage symlink
      file:
        src: "{{ storage_mount }}/storage"
        dest: "{{ app_root }}/storage"
        state: link
        force: yes

    # Improved symlink handling for assets directory
    - name: Check if assets is already a symlink
      stat:
        path: "{{ app_root }}/public/forum/assets"
      register: assets_stat

    - name: Check if mounted assets is empty
      find:
        paths: "{{ config_mount }}/assets"
        file_type: any
      register: mounted_assets_contents
      when: assets_stat.stat.exists and not assets_stat.stat.islnk

    - name: Backup original assets to mount
      copy:
        src: "{{ app_root }}/public/forum/assets/"
        dest: "{{ config_mount }}/assets/"
        remote_src: yes
        owner: www-data
        group: www-data
        mode: preserve
      when:
        - assets_stat.stat.exists
        - not assets_stat.stat.islnk
        - mounted_assets_contents.matched == 0

    - name: Remove original assets directory
      file:
        path: "{{ app_root }}/public/forum/assets"
        state: absent
      when: assets_stat.stat.exists and not assets_stat.stat.islnk

    - name: Create assets symlink
      file:
        src: "{{ config_mount }}/assets"
        dest: "{{ app_root }}/public/forum/assets"
        state: link
        force: yes

    # Moved up from the tail of the playbook. `Remove old application files`
    # deletes the whole tree including these links, and recreating them 200
    # lines later left the site broken for the length of the deploy.
    - name: Create config.php symlink to application directory
      file:
        src: "{{ config_mount }}/config.php"
        dest: "{{ app_root }}/config.php"
        state: link
        force: yes

    - name: Create gallery symlink
      file:
        src: "{{ storage_mount }}/gallery"
        dest: "{{ app_root }}/gallery-storage"
        state: link
        force: yes

    # The gallery keeps each file's position in its own filename. Years still
    # written under the previous key scheme are converted here, as part of the
    # deploy, rather than at whatever moment the next person happens to upload
    # something. `auto` checks every year, touches only the ones actually
    # holding invalid keys, and prints "Nothing to do." when there is nothing
    # to do — so this stays on every deploy rather than being a one-off.
    #
    # As www-data: it renames gallery files, which have to keep the ownership
    # PHP-FPM writes them with.
    - name: Bring the gallery ordering up to date
      become: yes
      become_user: www-data
      command: /usr/bin/php {{ app_root }}/public/gallery/migrate_ordering.php auto
      register: gallery_ordering
      changed_when: "'Nothing to do.' not in gallery_ordering.stdout"

    - name: Report what the gallery ordering migration did
      debug:
        var: gallery_ordering.stdout_lines
      when: "'Nothing to do.' not in gallery_ordering.stdout"

    - name: Configure MariaDB to use cold storage
      lineinfile:
        path: /etc/mysql/mariadb.conf.d/50-server.cnf
        regexp: '^datadir'
        line: 'datadir = {{ storage_mount }}/mysql'
      notify: restart mariadb

    - name: Harden MariaDB configuration
      blockinfile:
        path: /etc/mysql/mariadb.conf.d/50-server.cnf
        marker: "# {mark} ANSIBLE MANAGED SECURITY BLOCK"
        block: |
          # Security settings
          bind-address = 127.0.0.1
          skip-networking = 0
          skip-name-resolve = 1

          # Performance and security
          max_connections = 100
          connect_timeout = 10
          wait_timeout = 600
          max_allowed_packet = 64M
          thread_cache_size = 128
          sort_buffer_size = 4M
          bulk_insert_buffer_size = 16M
          tmp_table_size = 32M
          max_heap_table_size = 32M

          # Logging for security monitoring
          log_error = /var/log/mysql/error.log
          log_queries_not_using_indexes = 1
          long_query_time = 2

          # Disable dangerous functions
          local_infile = 0

          # Allow socket connections
          socket = /var/run/mysqld/mysqld.sock
      notify: restart mariadb

    - name: Stop MariaDB service if running
      service:
        name: mariadb
        state: stopped
      ignore_errors: yes

    - name: Check if MySQL system tables exist in custom location
      stat:
        path: "{{ storage_mount }}/mysql/mysql"
      register: mysql_system_tables

    - name: Initialize MariaDB data directory if needed
      command: mysql_install_db --user=mysql --datadir={{ storage_mount }}/mysql
      when: not mysql_system_tables.stat.exists

    - name: Create MariaDB startup wrapper script
      copy:
        content: |
          #!/bin/bash
          # Set umask for proper file permissions across Samba/LXC
          umask 0002
          # Execute the original MariaDB daemon
          exec /usr/sbin/mariadbd "$@"
        dest: /usr/local/bin/mariadbd-wrapper
        mode: '0755'

    - name: Create MariaDB systemd override directory
      file:
        path: /etc/systemd/system/mariadb.service.d
        state: directory
        mode: '0755'

    - name: Configure MariaDB to use wrapper script via systemd override
      copy:
        content: |
          [Service]
          ExecStart=
          ExecStart=/usr/local/bin/mariadbd-wrapper $MARIADB_OPTS
        dest: /etc/systemd/system/mariadb.service.d/override.conf
        mode: '0644'
      notify:
        - reload systemctl
        - restart mariadb

    - name: Flush handlers to restart MariaDB with new wrapper
      meta: flush_handlers

    - name: Ensure MariaDB is started and enabled
      service:
        name: mariadb
        state: started
        enabled: yes

    - name: Wait for MariaDB to be ready
      wait_for:
        port: 3306
        host: 127.0.0.1
        timeout: 30

    - name: Check if root password is already set (using socket)
      mysql_user:
        name: root
        login_unix_socket: /var/run/mysqld/mysqld.sock
        state: present
      register: root_password_check
      ignore_errors: yes

    - name: Set MariaDB root password (first time only)
      mysql_user:
        name: root
        password: "{{ mariadb_root_password | default('campweirdsteel123') }}"
        login_unix_socket: /var/run/mysqld/mysqld.sock
        state: present
        host_all: yes
      when: root_password_check is succeeded
      no_log: true

    - name: Create .my.cnf file for root user
      copy:
        content: |
          [client]
          user=root
          password={{ mariadb_root_password | default('campweirdsteel123') }}
          socket=/var/run/mysqld/mysqld.sock
        dest: /root/.my.cnf
        mode: '0600'
        owner: root
        group: root
      no_log: true

    - name: Create campweirdsteel database
      mysql_db:
        name: campweirdsteel
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock

    - name: Create campweirdsteel database user
      mysql_user:
        name: campweirdsteel
        password: "{{ mariadb_campweirdsteel_password | default('campweirdsteel456') }}"
        priv: 'campweirdsteel.*:ALL'
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock
      no_log: true

    - name: Remove anonymous MariaDB users
      mysql_user:
        name: ''
        host_all: yes
        state: absent
        login_unix_socket: /var/run/mysqld/mysqld.sock

    - name: Remove MariaDB test database
      mysql_db:
        name: test
        state: absent
        login_unix_socket: /var/run/mysqld/mysqld.sock

    - name: Get PHP version
      shell: php -r "echo PHP_MAJOR_VERSION.'.'.PHP_MINOR_VERSION;"
      register: php_version
      changed_when: false

    - name: Create nginx campweirdsteel config directory
      file:
        path: /etc/nginx/campweirdsteel
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Copy app nginx config out of webroot
      copy:
        src: "{{ app_root }}/.nginx.conf"
        dest: /etc/nginx/campweirdsteel/app.conf
        owner: root
        group: root
        mode: '0644'
        remote_src: yes
      notify: restart nginx

    - name: Copy gallery nginx config out of webroot
      copy:
        src: "{{ app_root }}/.nginx-gallery.conf"
        dest: /etc/nginx/campweirdsteel/gallery.conf
        owner: root
        group: root
        mode: '0644'
        remote_src: yes
      notify: restart nginx

    - name: Create nginx site configuration
      template:
        src: templates/campweirdsteel/nginx.conf.j2
        dest: /etc/nginx/sites-available/campweirdsteel
      notify: restart nginx

    # NOTE: if nginx.conf.j2 applies `limit_req zone=api` to the PHP location,
    # it must carry a large `burst=` with `nodelay`. A 500MB gallery upload is
    # ~100 chunk POSTs sent back to back, and zone=api is 60r/m — one request
    # per second — so uploads would 503 partway through. The zones below are
    # only *defined* here; where they are *applied* is in that template.
    - name: Configure nginx security settings
      blockinfile:
        path: /etc/nginx/nginx.conf
        marker: "# {mark} ANSIBLE MANAGED SECURITY BLOCK"
        insertafter: "http {"
        block: |
          # Security settings
          server_tokens off;

          # Rate limiting
          limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
          limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;

          # Buffer size limits. client_max_body_size only has to clear a
          # single upload chunk (MAX_CHUNK_SIZE, 8MB) — the gallery's real
          # ceiling is MAX_VIDEO_SIZE in includes/gallery/config.php.
          client_body_buffer_size 128k;
          client_header_buffer_size 1k;
          client_max_body_size 50m;
          large_client_header_buffers 2 1k;

          # Timeouts. client_body_timeout is measured between successive
          # reads, but 10s is thin for a 5MB chunk on camp wifi; the gallery
          # server block raises it to 120s for its own locations.
          client_body_timeout 30;
          client_header_timeout 10;
          keepalive_timeout 15 15;
          send_timeout 30;
      notify: restart nginx

    - name: Enable campweirdsteel site (after SSL certificate exists)
      file:
        src: /etc/nginx/sites-available/campweirdsteel
        dest: /etc/nginx/sites-enabled/campweirdsteel
        state: link
      notify: restart nginx

    - name: Remove default nginx site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: restart nginx

    - name: Validate nginx configuration before restarting
      command: nginx -t
      changed_when: false

    - name: Ensure nginx is started and enabled
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Get original PHP-FPM service configuration
      slurp:
        src: "/lib/systemd/system/php{{ php_version.stdout }}-fpm.service"
      register: original_php_fpm_service

    - name: Parse original ExecStart command
      set_fact:
        original_exec_start: "{{ original_php_fpm_service.content | b64decode | regex_search('ExecStart=(.+)', '\\1') | first }}"

    # PHP-FPM hardening.
    #
    # The important change is `disable_functions`. It previously listed
    # `exec`, which made GalleryManager::queueTranscode() a permanent no-op:
    # function_exists('exec') returns false for a disabled function, the guard
    # fired, and every uploaded video was filed in whatever container the
    # camera produced and never converted — silently, with the upload still
    # reporting success. iPhone HEVC .mov and .avi do not play in Chrome, so
    # the feature existed entirely to fix the case it was skipping.
    #
    # The fix is in the application (queueTranscode now spawns through
    # symfony/process, i.e. proc_open, the same path php-ffmpeg has always
    # used for poster frames) — so `exec` and friends stay blocked here. The
    # list below is unchanged except for dropping `curl_exec`, which breaks
    # outbound HTTP for Flarum extensions and buys nothing that
    # allow_url_fopen=Off does not.
    #
    # proc_open is deliberately NOT on this list. Adding it would break the
    # gallery's video pipeline end to end.
    - name: Configure PHP-FPM
      lineinfile:
        path: "/etc/php/{{ php_version.stdout }}/fpm/php.ini"
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        backup: yes
      loop:
        - { regexp: '^upload_max_filesize\s*=', line: 'upload_max_filesize = {{ php_upload_max_filesize }}' }
        - { regexp: '^post_max_size\s*=', line: 'post_max_size = {{ php_post_max_size }}' }
        - { regexp: '^max_execution_time\s*=', line: 'max_execution_time = {{ php_max_execution_time }}' }
        - { regexp: '^max_input_time\s*=', line: 'max_input_time = {{ php_max_input_time }}' }
        - { regexp: '^expose_php\s*=', line: 'expose_php = Off' }
        - { regexp: '^display_errors\s*=', line: 'display_errors = Off' }
        - { regexp: '^display_startup_errors\s*=', line: 'display_startup_errors = Off' }
        - { regexp: '^log_errors\s*=', line: 'log_errors = On' }
        - { regexp: '^allow_url_fopen\s*=', line: 'allow_url_fopen = Off' }
        - { regexp: '^allow_url_include\s*=', line: 'allow_url_include = Off' }
        - { regexp: '^session.cookie_httponly\s*=', line: 'session.cookie_httponly = 1' }
        - { regexp: '^session.cookie_secure\s*=', line: 'session.cookie_secure = 1' }
        - { regexp: '^session.use_only_cookies\s*=', line: 'session.use_only_cookies = 1' }
        - { regexp: '^disable_functions\s*=', line: 'disable_functions = exec,passthru,shell_exec,system,popen,parse_ini_file,show_source' }
      notify: restart php-fpm

    # The transcode worker runs under the CLI SAPI, not FPM, and needs no
    # limits at all — an encode legitimately takes minutes. Pinned explicitly
    # so a future hardening pass on the CLI ini does not silently break video
    # conversion the way the FPM one did.
    - name: Configure PHP CLI for the transcode worker
      lineinfile:
        path: "/etc/php/{{ php_version.stdout }}/cli/php.ini"
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        backup: yes
      loop:
        - { regexp: '^max_execution_time\s*=', line: 'max_execution_time = 0' }
        - { regexp: '^memory_limit\s*=', line: 'memory_limit = 512M' }
        - { regexp: '^disable_functions\s*=', line: 'disable_functions =' }

    - name: Create improved php-fpm wrapper script that preserves notification behavior
      copy:
        content: |
          #!/bin/bash
          # Set umask for proper file permissions across Samba/LXC
          umask 0002
          # Preserve all environment variables, signals, and notification behavior
          exec "$@"
        dest: /usr/local/bin/php-fpm-wrapper
        mode: '0755'

    - name: Create php-fpm systemd override directory
      file:
        path: "/etc/systemd/system/php{{ php_version.stdout }}-fpm.service.d"
        state: directory
        mode: '0755'

    - name: Configure php-fpm to use wrapper script with proper notification handling
      copy:
        content: |
          [Service]
          ExecStart=
          ExecStart=/usr/local/bin/php-fpm-wrapper {{ original_exec_start }}
        dest: "/etc/systemd/system/php{{ php_version.stdout }}-fpm.service.d/override.conf"
        mode: '0644'
      notify:
        - reload systemctl

    - name: Flush handlers to reload systemd configuration
      meta: flush_handlers

    - name: Restart php-fpm after systemd override
      service:
        name: "php{{ php_version.stdout }}-fpm"
        state: restarted

    - name: Ensure php-fpm is started and enabled (after override)
      service:
        name: "php{{ php_version.stdout }}-fpm"
        state: started
        enabled: yes

    - name: Verify php-fpm socket exists
      wait_for:
        path: "/var/run/php/php{{ php_version.stdout }}-fpm.sock"
        timeout: 30
      register: socket_check
      ignore_errors: yes

    - name: Debug php-fpm socket status
      debug:
        msg: "PHP-FPM socket status: {{ 'Found' if socket_check is succeeded else 'Not found' }}"

    # Security Monitoring and Logging
    - name: Configure logwatch
      lineinfile:
        path: /etc/logwatch/conf/logwatch.conf
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        create: yes
      loop:
        - { regexp: '^MailTo =', line: 'MailTo = zinefer@gmail.com' }
        - { regexp: '^MailFrom =', line: 'MailFrom = logwatch@campweirdsteel.com' }
        - { regexp: '^Detail =', line: 'Detail = Med' }
        - { regexp: '^Service =', line: 'Service = All' }

    - name: Setup log rotation for application logs
      copy:
        content: |
          {{ app_root }}/storage/logs/*.log {
              daily
              missingok
              rotate 52
              compress
              delaycompress
              notifempty
              create 644 www-data www-data
              postrotate
                  systemctl reload php{{ php_version.stdout }}-fpm
              endscript
          }
        dest: /etc/logrotate.d/campweirdsteel

    # Final Verification
    - name: Verify the FPM pool can still spawn the transcode worker
      become: yes
      become_user: www-data
      command: >-
        php -r "require '{{ app_root }}/vendor/autoload.php';
        exit(class_exists('Symfony\\Component\\Process\\Process') ? 0 : 1);"
      changed_when: false

    - name: Report the PHP-FPM limits the gallery depends on
      command: >-
        php --php-ini /etc/php/{{ php_version.stdout }}/fpm/php.ini
        -r "foreach (['upload_max_filesize','post_max_size','max_execution_time','disable_functions'] as $k) { echo $k, ' = ', ini_get($k), PHP_EOL; }"
      register: fpm_limits
      changed_when: false

    - name: Display PHP-FPM limits
      debug:
        var: fpm_limits.stdout_lines

    - name: Verify SSL certificate installation
      uri:
        url: "https://campweirdsteel.com"
        method: HEAD
        status_code: [200, 301, 302]
        timeout: 10
      register: ssl_check
      ignore_errors: yes

    - name: Display SSL verification result
      debug:
        msg: "SSL certificate {{ 'working' if ssl_check is succeeded else 'needs attention' }}"

    - name: Verify firewall is active
      command: ufw status
      register: ufw_status
      changed_when: false

    - name: Display firewall status
      debug:
        var: ufw_status.stdout_lines

    - name: Verify fail2ban jails actually started
      command: fail2ban-client status
      register: fail2ban_jails
      changed_when: false
      ignore_errors: yes

    - name: Display fail2ban jail status
      debug:
        var: fail2ban_jails.stdout_lines
